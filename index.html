<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Minecraft Engine</title>
<style>
body{margin:0;overflow:hidden;background:#000;}
canvas{display:block;}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const x=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

// ======================
// 설정
// ======================
const size=30;
const chunks={};
const keys={};

// ======================
// 입력
// ======================
addEventListener("keydown",e=>keys[e.code]=1);
addEventListener("keyup",e=>keys[e.code]=0);

// ======================
// 플레이어
// ======================
const p={
  x:200,y:100,
  vx:0,vy:0,
  dir:1,
  onGround:false
};

// ======================
// 청크 생성 (진짜 핵심)
// ======================
function getBlock(x,y){
  const cx=Math.floor(x/300);
  const cy=Math.floor(y/300);

  const key=cx+","+cy;

  if(!chunks[key]){
    chunks[key]=generateChunk(cx,cy);
  }

  return chunks[key][x+","+y];
}

function generateChunk(cx,cy){
  const data={};

  for(let y=0;y<10;y++){
    for(let x=0;x<10;x++){

      let wx=cx*10+x;
      let wy=cy*10+y;

      let ground=Math.sin(wx*0.3)*3+6;

      let type=0; // 0=공기,1=흙,2=돌

      if(wy>ground){
        type=1;
      }
      if(wy>8){
        type=2;
      }

      data[wx+","+wy]=type;
    }
  }

  return data;
}

// ======================
// 블록 조회
// ======================
function blockAt(x,y){
  let bx=Math.floor(x/size);
  let by=Math.floor(y/size);
  return getBlock(bx,by)||0;
}

// ======================
// 충돌
// ======================
function collide(){
  p.onGround=false;

  let under=blockAt(p.x,p.y+40);

  if(under!==0){
    p.onGround=true;
    p.vy=0;
  }
}

// ======================
// 업데이트
// ======================
function update(){

  if(keys.ArrowLeft)p.x-=3;
  if(keys.ArrowRight)p.x+=3;

  if(keys.Space && p.onGround){
    p.vy=-8;
  }

  p.vy+=0.4;
  p.y+=p.vy;

  collide();

}

// ======================
// 그리기
// ======================
function draw(){

  x.clearRect(0,0,c.width,c.height);

  // 블록 렌더링
  for(let cx=-20;cx<20;cx++){
    for(let cy=-10;cy<15;cy++){

      let bx=Math.floor(p.x/size)+cx;
      let by=Math.floor(p.y/size)+cy;

      let type=blockAt(bx*size,by*size);

      let px=cx*size - (p.x%size);
      let py=cy*size - (p.y%size);

      if(type===1){
        x.fillStyle="#3b7d2a"; // 흙
      }
      else if(type===2){
        x.fillStyle="#555"; // 돌
      }
      else continue;

      x.fillRect(px,py,size,size);
    }
  }

  // 플레이어
  x.fillStyle="pink";
  x.fillRect(200,200,20,40);

}

// ======================
// 루프
// ======================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
