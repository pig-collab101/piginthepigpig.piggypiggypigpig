<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pig Engine P2</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;}
canvas{display:block;}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>

// =====================
// CANVAS
// =====================
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
window.addEventListener("resize",resize);
resize();

// =====================
// STATE
// =====================
const keys={};

const game={
    paused:false
};

const player={
    x:100,
    y:300,
    vx:0,
    vy:0,
    speed:5,
    gravity:0.7,
    hp:100,
    onGround:false,
    cooldown:0
};

const bullets=[];
const enemies=[];

// =====================
// MONSTER AUTO GEN (3 TYPES)
// =====================
for(let i=0;i<30;i++){

    let type = i%3;

    enemies.push({
        x:400+i*140,
        y:300,
        hp:20+type*20,
        speed:1+type*0.5,
        type:type, // 0 slime,1 melee,2 ranged
        alive:true,
        cooldown:50
    });
}

// =====================
// INPUT
// =====================
window.addEventListener("keydown",e=>{
    keys[e.code]=true;
});

window.addEventListener("keyup",e=>{
    keys[e.code]=false;
});

// =====================
// PLAYER UPDATE
// =====================
function updatePlayer(){

    player.vx=0;

    if(keys["ArrowLeft"]) player.vx=-player.speed;
    if(keys["ArrowRight"]) player.vx=player.speed;

    player.x+=player.vx;

    if(keys["Space"] && player.onGround){
        player.vy=-12;
        player.onGround=false;
    }

    player.vy+=player.gravity;
    player.y+=player.vy;

    if(player.y>300){
        player.y=300;
        player.vy=0;
        player.onGround=true;
    }

    if(player.cooldown>0) player.cooldown--;
}

// =====================
// ENEMY AI (3 TYPE LOGIC)
// =====================
function updateEnemies(){

    enemies.forEach(e=>{

        if(!e.alive) return;

        let dx=player.x-e.x;

        if(e.type===0){
            // 슬라임: 따라오기
            if(Math.abs(dx)<400)
                e.x+=Math.sign(dx)*e.speed;
        }

        if(e.type===1){
            // 근접: 공격
            if(Math.abs(dx)<40){
                player.hp-=0.2;
            } else if(Math.abs(dx)<300){
                e.x+=Math.sign(dx)*e.speed;
            }
        }

        if(e.type===2){
            // 원거리
            e.cooldown--;
            if(e.cooldown<=0){
                e.cooldown=80;

                bullets.push({
                    x:e.x,
                    y:e.y,
                    vx:Math.sign(dx)*5,
                    from:"enemy"
                });
            }
        }
    });
}

// =====================
// BULLETS + COLLISION
// =====================
function updateBullets(){

    for(let i=bullets.length-1;i>=0;i--){

        let b=bullets[i];

        b.x+=b.vx;

        if(b.from==="enemy"){

            if(Math.abs(b.x-player.x)<20){
                player.hp-=10;
                bullets.splice(i,1);
                continue;
            }

        } else {

            enemies.forEach(e=>{
                if(!e.alive) return;

                if(Math.abs(b.x-e.x)<20){
                    e.hp-=15;
                    bullets.splice(i,1);

                    if(e.hp<=0) e.alive=false;
                }
            });

        }
    }
}

// =====================
// PLAYER ATTACK
// =====================
function attack(){

    if(player.cooldown>0) return;

    player.cooldown=20;

    bullets.push({
        x:player.x+20,
        y:player.y+10,
        vx:8,
        from:"player"
    });
}

// =====================
// UPDATE MASTER
// =====================
function update(){

    if(game.paused) return;

    updatePlayer();
    updateEnemies();
    updateBullets();
}

// =====================
// DRAW
// =====================
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // player
    ctx.fillStyle="pink";
    ctx.fillRect(player.x,player.y,40,40);

    // enemies
    enemies.forEach(e=>{
        if(!e.alive) return;

        ctx.fillStyle = e.type===0?"green":e.type===1?"red":"purple";
        ctx.fillRect(e.x,e.y,30,30);
    });

    // bullets
    ctx.fillStyle="orange";
    bullets.forEach(b=>{
        ctx.fillRect(b.x,b.y,8,4);
    });

    // UI
    ctx.fillStyle="black";
    ctx.fillText("HP:"+player.hp.toFixed(0),20,20);
}

// =====================
// CONTROLS
// =====================
window.addEventListener("keydown",e=>{
    if(e.code==="KeyJ") attack();
});

// =====================
// LOOP (1개만)
// =====================
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
