<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chunk World Engine v1</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

window.onresize=()=> {
canvas.width=innerWidth;
canvas.height=innerHeight;
};

//////////////////////////////
// 🎮 WORLD CONFIG
//////////////////////////////
const TILE=40;
const CHUNK_SIZE=20;

let cameraX=0;

//////////////////////////////
// 👤 PLAYER
//////////////////////////////
const player={
x:100,y:100,w:30,h:40,
vx:0,vy:0,
speed:4,
jumpPower:12,
onGround:false
};

//////////////////////////////
// 🌍 CHUNKS (무한 월드 핵심)
//////////////////////////////
const chunks=new Map();

function getChunk(cx){
if(chunks.has(cx)) return chunks.get(cx);

let data=[];

// 🌱 자동 생성 (노이즈 느낌)
for(let i=0;i<CHUNK_SIZE;i++){
let worldX=cx*CHUNK_SIZE+i;
let h=10+Math.floor(Math.sin(worldX*0.2)*3);

data.push({
x:worldX*TILE,
y:canvas.height - h*TILE,
w:TILE,
h:h*TILE
});
}

chunks.set(cx,data);
return data;
}

//////////////////////////////
// 🎮 INPUT
//////////////////////////////
const key={};

window.addEventListener("keydown",e=>key[e.code]=true);
window.addEventListener("keyup",e=>key[e.code]=false);

function updatePlayer(){
player.vx=0;

if(key["ArrowLeft"]) player.vx=-player.speed;
if(key["ArrowRight"]) player.vx=player.speed;

if(key["Space"] && player.onGround){
player.vy=-player.jumpPower;
player.onGround=false;
}

player.vy+=0.5;

player.x+=player.vx;
player.y+=player.vy;

// 바닥 충돌
player.onGround=false;
const cx=Math.floor(player.x/(TILE*CHUNK_SIZE));
const chunk=getChunk(cx);

for(const b of chunk){
if(player.x < b.x+b.w &&
player.x+player.w > b.x &&
player.y < b.y+b.h &&
player.y+player.h > b.y){

player.y=b.y-player.h;
player.vy=0;
player.onGround=true;
}
}

cameraX=player.x-innerWidth/2;
}

//////////////////////////////
// 👾 SIMPLE MONSTER SYSTEM
//////////////////////////////
const mobs=[];

function spawnMob(x){
mobs.push({x,y:0,hp:10});
}

function updateMobs(){
for(const m of mobs){
if(m.x<player.x) m.x+=1;
else m.x-=1;
}
}

//////////////////////////////
// 🎨 DRAW
//////////////////////////////
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

// sky
ctx.fillStyle="#87CEEB";
ctx.fillRect(0,0,canvas.width,canvas.height);

// chunks
for(let i=-2;i<3;i++){
const cx=Math.floor((player.x+i*innerWidth)/(TILE*CHUNK_SIZE));
const chunk=getChunk(cx);

for(const b of chunk){
ctx.fillStyle="#3cb043";
ctx.fillRect(b.x-cameraX,b.y,b.w,b.h);
}
}

// player
ctx.fillStyle="pink";
ctx.fillRect(player.x-cameraX,player.y,player.w,player.h);

// mobs
ctx.fillStyle="red";
for(const m of mobs){
ctx.fillRect(m.x-cameraX,player.y-20,20,20);
}
}

//////////////////////////////
// LOOP
//////////////////////////////
function loop(){
updatePlayer();
updateMobs();
draw();
requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
