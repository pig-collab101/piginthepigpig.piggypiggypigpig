<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pig Engine v1</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;}
canvas{display:block;}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
// ======================
// 1. CANVAS
// ======================
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ======================
// 2. STATE (절대 여기서만 데이터)
// ======================
const game = {
    paused:false
};

const player = {
    x:100,
    y:300,
    vx:0,
    vy:0,
    speed:5,
    gravity:0.7,
    hp:100
};

const keys = {};

const enemies = [
    {x:500,y:300,hp:30,speed:1,type:"slime"},
    {x:800,y:300,hp:50,speed:1.5,type:"bat"},
    {x:1100,y:300,hp:80,speed:2,type:"orc"}
];

// ======================
// 3. INPUT
// ======================
window.addEventListener("keydown",e=>{
    keys[e.code]=true;
});

window.addEventListener("keyup",e=>{
    keys[e.code]=false;
});

// ======================
// 4. UPDATE
// ======================
function updatePlayer(){

    player.vx = 0;

    if(keys["ArrowLeft"]) player.vx = -player.speed;
    if(keys["ArrowRight"]) player.vx = player.speed;

    player.x += player.vx;

    player.vy += player.gravity;
    player.y += player.vy;

    if(player.y > 300){
        player.y = 300;
        player.vy = 0;
    }
}

function updateEnemies(){

    enemies.forEach(e=>{
        if(e.hp <= 0) return;

        let dx = player.x - e.x;

        if(Math.abs(dx) < 300){
            e.x += Math.sign(dx) * e.speed;
        }
    });
}

function updateCombat(){

    enemies.forEach(e=>{
        if(Math.abs(player.x - e.x) < 40){
            player.hp -= 0.05;
        }
    });
}

function update(){
    if(game.paused) return;

    updatePlayer();
    updateEnemies();
    updateCombat();
}

// ======================
// 5. DRAW
// ======================
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // player
    ctx.fillStyle="pink";
    ctx.fillRect(player.x,player.y,40,40);

    // enemies
    enemies.forEach(e=>{
        if(e.hp<=0) return;

        ctx.fillStyle="green";
        ctx.fillRect(e.x,e.y,40,40);
    });

    // UI
    ctx.fillStyle="black";
    ctx.fillText("HP:"+player.hp.toFixed(0),20,20);
}

// ======================
// 6. LOOP
// ======================
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
