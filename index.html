<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pig Engine v2 SAFE</title>

<style>
body{margin:0;overflow:hidden;background:#87CEEB;}
canvas{display:block;}
</style>
</head>

<body>

<script>
// =========================
// SAFE ENGINE CORE
// =========================

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");
document.body.appendChild(canvas);

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
window.addEventListener("resize",resize);
resize();

// =========================
// SAFE STATE WRAPPER
// =========================
const Engine={
  entities:[],
  projectiles:[],
  particles:[],
  running:true
};

// =========================
// SAFE PLAYER
// =========================
const player={
  x:100,y:300,
  vx:0,vy:0,
  w:40,h:50,
  hp:100,
  speed:5,
  onGround:false
};

// =========================
// INPUT SAFE MAP
// =========================
const keys=Object.create(null);

addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

// =========================
// SAFE MONSTER FACTORY
// =========================
function Monster(type,x,y){
  const base={
    slime:{hp:30,speed:1,color:"green"},
    bat:{hp:20,speed:2,color:"purple"},
    wizard:{hp:80,speed:0.5,color:"cyan"}
  }[type];

  if(!base) return null;

  return {
    type,
    x,y,
    hp:base.hp,
    speed:base.speed,
    color:base.color,
    dead:false,

    update(){
      if(this.dead) return;

      const dx=player.x-this.x;
      this.x+=Math.sign(dx)*this.speed;

      if(Math.abs(dx)<40){
        player.hp=Math.max(0,player.hp-0.2);
      }

      if(this.hp<=0) this.dead=true;
    },

    draw(){
      if(this.dead) return;

      ctx.fillStyle=this.color;
      ctx.fillRect(this.x,this.y,40,40);
    }
  };
}

// =========================
// SAFE SPAWNER
// =========================
function spawn(type,x,y){
  const m=Monster(type,x,y);
  if(m) Engine.entities.push(m);
}

// =========================
// SAFE PLAYER UPDATE
// =========================
function updatePlayer(){

  if(keys["ArrowLeft"]) player.vx=-player.speed;
  else if(keys["ArrowRight"]) player.vx=player.speed;
  else player.vx*=0.8;

  if(keys["Space"] && player.onGround){
    player.vy=-12;
    player.onGround=false;
  }

  player.vy+=0.8;

  player.x+=player.vx;
  player.y+=player.vy;

  if(player.y>400){
    player.y=400;
    player.vy=0;
    player.onGround=true;
  }
}

// =========================
// SAFE UPDATE LOOP
// =========================
function update(){

  if(!Engine.running) return;

  updatePlayer();

  for(const e of Engine.entities){
    if(e && e.update) e.update();
  }

  // cleanup dead safely
  Engine.entities=Engine.entities.filter(e=>e && !e.dead);
}

// =========================
// SAFE DRAW LOOP
// =========================
function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // background ALWAYS safe
  ctx.fillStyle="#87CEEB";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ground
  ctx.fillStyle="#3cb043";
  ctx.fillRect(0,400,canvas.width,200);

  // player SAFE
  ctx.fillStyle="pink";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  // entities SAFE DRAW
  for(const e of Engine.entities){
    if(e && e.draw) e.draw();
  }

  // HUD SAFE
  ctx.fillStyle="black";
  ctx.fillText("HP:"+Math.floor(player.hp),20,20);
}

// =========================
// GAME LOOP SAFE
// =========================
function loop(){

  try{
    update();
    draw();
  }catch(err){
    console.log("ENGINE SAFE MODE:",err);
  }

  requestAnimationFrame(loop);
}

// =========================
// INIT SAFE SPAWN
// =========================
spawn("slime",400,400);
spawn("bat",600,350);
spawn("wizard",800,300);

loop();

</script>

</body>
</html>
