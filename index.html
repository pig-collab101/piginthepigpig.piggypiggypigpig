<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chunk Block RPG</title>
<style>
body{margin:0;overflow:hidden;background:#87ceeb;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

const keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);

c.addEventListener("contextmenu",e=>e.preventDefault());

/* =====================
   PLAYER
===================== */
const player={
x:100,y:100,vx:0,vy:0,w:30,h:40,onGround:false
};

function updatePlayer(){
if(keys.ArrowLeft) player.vx=-4;
else if(keys.ArrowRight) player.vx=4;
else player.vx*=0.8;

if(keys.Space && player.onGround){
player.vy=-10;
player.onGround=false;
}

player.vy+=0.5;
player.x+=player.vx;
player.y+=player.vy;
}

/* =====================
   CHUNK WORLD
===================== */
const CHUNK=500;
const BLOCK=25;
const chunks=new Map();

function noise(x){
return Math.sin(x*0.01)*20;
}

function block(x,y,type="dirt"){
return{x,y,w:BLOCK,h:BLOCK,type};
}

function genChunk(cx){
if(chunks.has(cx)) return chunks.get(cx);

const b=[];
const m=[];

/* terrain */
for(let i=0;i<20;i++){
const x=cx*CHUNK+i*BLOCK;
const y=c.height/2+noise(x);

b.push(block(x,y,"grass"));
for(let j=1;j<5;j++){
b.push(block(x,y+j*BLOCK,"dirt"));
}
}

/* monsters */
for(let i=0;i<4;i++){
m.push({
x:cx*CHUNK+Math.random()*CHUNK,
y:100,
vx:0,hp:20
});
}

const chunk={blocks:b,monsters:m};
chunks.set(cx,chunk);
return chunk;
}

function getCX(){return Math.floor(player.x/CHUNK);}

/* =====================
   COLLISION
===================== */
function collide(chunk){
player.onGround=false;

for(const b of chunk.blocks){
if(
player.x<b.x+b.w &&
player.x+player.w>b.x &&
player.y+player.h<b.y+5 &&
player.y+player.h+player.vy>b.y
){
player.y=b.y-player.h;
player.vy=0;
player.onGround=true;
}
}
}

/* =====================
   MONSTERS
===================== */
function updateMonsters(chunk){
for(const m of chunk.monsters){
if(m.hp<=0) continue;

const dx=player.x-m.x;

if(Math.abs(dx)<250){
m.x+=Math.sign(dx)*1.2;
}

if(Math.abs(dx)<25){
player.vy-=0.2;
}
}
}

/* =====================
   MOUSE BLOCK SYSTEM
===================== */
let mouse={x:0,y:0};

c.addEventListener("mousemove",e=>{
mouse.x=e.clientX;
mouse.y=e.clientY;
});

c.addEventListener("mousedown",e=>{
const cx=getCX();
const chunk=genChunk(cx);

const wx=mouse.x+cameraX;
const wy=mouse.y;

const bx=Math.floor(wx/BLOCK)*BLOCK;
const by=Math.floor(wy/BLOCK)*BLOCK;

if(e.button===0){
chunk.blocks.push(block(bx,by,"dirt"));
}

if(e.button===2){
for(let i=chunk.blocks.length-1;i>=0;i--){
const b=chunk.blocks[i];
if(b.x===bx&&b.y===by){
chunk.blocks.splice(i,1);
break;
}
}
}
});

/* =====================
   CAMERA
===================== */
let cameraX=0;

/* =====================
   UPDATE
===================== */
function update(){
updatePlayer();

const cx=getCX();
const chunk=genChunk(cx);

updateMonsters(chunk);
collide(chunk);

cameraX=player.x-innerWidth/2;
}

/* =====================
   DRAW
===================== */
function draw(){
ctx.clearRect(0,0,c.width,c.height);

const cx=getCX();
const chunk=genChunk(cx);

/* blocks */
for(const b of chunk.blocks){
ctx.fillStyle=b.type==="grass"?"green":"#8b5a2b";
ctx.fillRect(b.x-cameraX,b.y,b.w,b.h);
}

/* monsters */
ctx.fillStyle="red";
for(const m of chunk.monsters){
ctx.fillRect(m.x-cameraX,m.y,20,20);
}

/* player */
ctx.fillStyle="pink";
ctx.fillRect(player.x-cameraX,player.y,player.w,player.h);
}

/* =====================
   LOOP
===================== */
function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();

</script>
</body>
</html>
