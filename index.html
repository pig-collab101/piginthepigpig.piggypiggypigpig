<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Battle Fix Engine</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

//////////////////////
// 👤 PLAYER
//////////////////////
const player={
x:100,y:100,
w:25,h:35,
vx:0,vy:0,
onGround:false
};

//////////////////////
// 👾 ENEMIES
//////////////////////
const mobs=[];

function spawnMob(x,y){
mobs.push({
x,y,
hp:30
});
}

// 시작 적
spawnMob(400,100);
spawnMob(700,100);

//////////////////////
// 🔫 BULLETS
//////////////////////
const bullets=[];

function shoot(){
bullets.push({
x:player.x+20,
y:player.y+15,
vx:playerDir*6,
life:80
});
}

//////////////////////
// 🎮 INPUT
//////////////////////
const key={};
let playerDir=1;

addEventListener("keydown",e=>{
key[e.code]=true;

if(e.code==="Space" && player.onGround){
player.vy=-8;
player.onGround=false;
}

if(e.code==="KeyJ"){
shoot();
}
});

addEventListener("keyup",e=>{
key[e.code]=false;
});

//////////////////////
// 🌍 UPDATE PLAYER
//////////////////////
function updatePlayer(){

player.vx=0;

if(key["ArrowLeft"]){
player.vx=-3;
playerDir=-1;
}
if(key["ArrowRight"]){
player.vx=3;
playerDir=1;
}

player.vy+=0.4;

player.x+=player.vx;
player.y+=player.vy;

// 바닥
if(player.y>300){
player.y=300;
player.vy=0;
player.onGround=true;
}

}

//////////////////////
// 👾 UPDATE ENEMIES
//////////////////////
function updateMobs(){
for(const m of mobs){

if(m.hp<=0) continue;

// AI (추격)
if(m.x<player.x) m.x+=1;
else m.x-=1;

// 충돌 데미지
if(Math.abs(m.x-player.x)<20){
player.x-=2;
}

}
}

//////////////////////
// 🔫 BULLET LOGIC
//////////////////////
function updateBullets(){

for(let i=bullets.length-1;i>=0;i--){
const b=bullets[i];

b.x+=b.vx;
b.life--;

for(const m of mobs){
if(m.hp<=0) continue;

if(Math.abs(b.x-m.x)<20 && Math.abs(b.y-m.y)<20){
m.hp-=10;
b.life=0;
}
}

if(b.life<=0){
bullets.splice(i,1);
}
}

}

//////////////////////
// 🎨 DRAW
//////////////////////
function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

// player
ctx.fillStyle="pink";
ctx.fillRect(player.x,player.y,player.w,player.h);

// mobs
ctx.fillStyle="red";
for(const m of mobs){
if(m.hp<=0) continue;
ctx.fillRect(m.x,m.y,25,25);
}

// bullets
ctx.fillStyle="yellow";
for(const b of bullets){
ctx.fillRect(b.x,b.y,6,3);
}

}

//////////////////////
// LOOP
//////////////////////
function loop(){
updatePlayer();
updateMobs();
updateBullets();

draw();
requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
