<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PIG RPG ENGINE</title>
<style>
body{margin:0;overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>

//====================
// CANVAS
//====================
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

//====================
// WORLD
//====================
const world={
  cameraX:0,
  groundY:0
};

//====================
// PLAYER
//====================
const player={
  x:100,y:200,w:40,h:40,
  vx:0,vy:0,
  hp:100,
  dir:1
};

//====================
// INPUT
//====================
const key={};
addEventListener("keydown",e=>key[e.code]=1);
addEventListener("keyup",e=>key[e.code]=0);

//====================
// WEAPON SYSTEM
//====================
const inventory={
  weapons:[{name:"나무검",atk:5}]
};

const weaponTree={
  "나무검":"철검",
  "철검":"마검",
  "마검":"용검",
  "용검":"신검"
};

function getAttack(){
  return inventory.weapons.at(-1).atk;
}

function evolveWeapon(){
  const w=inventory.weapons.at(-1);
  if(!w) return;

  const next=weaponTree[w.name];
  if(!next) return;

  w.name=next;
  w.atk+=10;
}

//====================
// BIOME
//====================
function getBiome(x){
  if(x<3000) return "#87CEEB";
  if(x<7000) return "#2b2b3c";
  if(x<12000) return "#ff5500";
  return "#8fdfff";
}

//====================
// ENEMIES
//====================
const enemies=[];

function spawn(x){
  enemies.push({
    x,
    y:world.groundY-40,
    w:35,h:35,
    hp:20+Math.random()*30,
    speed:1+Math.random()*1.5,
    dead:false,
    knock:0
  });
}

for(let i=0;i<20;i++){
  spawn(300+i*250);
}

//====================
// ATTACK
//====================
function attack(){
  const dmg=getAttack();

  for(const m of enemies){
    if(m.dead) continue;

    const dx=Math.abs(player.x-m.x);
    const dy=Math.abs(player.y-m.y);

    if(dx<60&&dy<40){
      m.hp-=dmg;

      m.knock=player.dir*8;

      if(m.hp<=0) m.dead=true;
    }
  }
}

//====================
// UPDATE
//====================
function update(){

  // move
  player.vx=0;
  if(key["ArrowLeft"]) player.vx=-3;
  if(key["ArrowRight"]) player.vx=3;

  player.x+=player.vx;

  world.cameraX=player.x-innerWidth/2;

  // enemies
  for(const m of enemies){

    if(m.dead) continue;

    const dx=player.x-m.x;

    if(Math.abs(dx)<200){
      m.x+=Math.sign(dx)*m.speed;
    }

    if(Math.abs(dx)<30){
      player.hp-=0.2;
    }

    if(m.knock){
      m.x+=m.knock;
      m.knock*=0.8;
    }
  }
}

//====================
// DRAW
//====================
function draw(){

  // bg
  ctx.fillStyle=getBiome(player.x);
  ctx.fillRect(0,0,canvas.width,canvas.height);

  world.groundY=canvas.height-100;

  // ground
  ctx.fillStyle="#3CB043";
  ctx.fillRect(0,world.groundY,canvas.width,100);

  // player
  ctx.fillStyle="pink";
  ctx.fillRect(player.x-world.cameraX,player.y,player.w,player.h);

  // weapon
  ctx.fillStyle="white";
  ctx.fillText(
    inventory.weapons.at(-1).name,
    player.x-world.cameraX,
    player.y-10
  );

  // enemies
  for(const m of enemies){
    if(m.dead) continue;

    ctx.fillStyle="lime";
    ctx.fillRect(
      m.x-world.cameraX,
      m.y,
      m.w,
      m.h
    );
  }

  // HP
  ctx.fillStyle="red";
  ctx.fillRect(20,20,200,10);

  ctx.fillStyle="lime";
  ctx.fillRect(20,20,200*(player.hp/100),10);
}

//====================
// LOOP
//====================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

//====================
// CONTROLS
//====================
addEventListener("keydown",e=>{

  if(e.code==="KeyJ") attack();
  if(e.code==="KeyK") evolveWeapon();

});

</script>
</body>
</html>
