<canvas id="c"></canvas>
<script>
const c=document.getElementById("c");
const x=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

let t=0;

function drawStick(x0,y0){

  // 머리
  x.beginPath();
  x.arc(x0,y0,20,0,Math.PI*2);
  x.stroke();

  // 몸
  x.beginPath();
  x.moveTo(x0,y0+20);
  x.lineTo(x0,y0+80);
  x.stroke();

  // 팔 (애니메이션)
  let swing=Math.sin(t)*20;

  x.beginPath();
  x.moveTo(x0,y0+40);
  x.lineTo(x0-30+swing,y0+60);
  x.moveTo(x0,y0+40);
  x.lineTo(x0+30-swing,y0+60);
  x.stroke();

  // 다리
  x.beginPath();
  x.moveTo(x0,y0+80);
  x.lineTo(x0-20,y0+120);
  x.moveTo(x0,y0+80);
  x.lineTo(x0+20,y0+120);
  x.stroke();

  // 눈 (표정 핵심)
  x.fillRect(x0-7,y0-5,3,3);
  x.fillRect(x0+4,y0-5,3,3);
}

function loop(){
  x.clearRect(0,0,c.width,c.height);

  drawStick(innerWidth/2,innerHeight/2);

  t+=0.1;
  requestAnimationFrame(loop);
}

loop();
</script>
