<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🐷 Pixel Pig Fighter</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#87CEEB;
    font-family:sans-serif;
}

canvas{
    display:block;
    background:linear-gradient(#87CEEB,#d8f5ff);
}

</style>

<script>

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

document.addEventListener("DOMContentLoaded",()=>{

    document.body.appendChild(canvas);

    resize();

    gameLoop();

});

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

}

window.addEventListener("resize",resize);

const groundY=canvas.height-120;

const keys={};

Object.defineProperty(keys,"left",{
    get(){
        return keys["ArrowLeft"]||keys["KeyA"];
    }
});

Object.defineProperty(keys,"right",{
    get(){
        return keys["ArrowRight"]||keys["KeyD"];
    }
});

window.addEventListener("keydown",e=>{

    keys[e.code]=true;

    if(e.code==="Space"){
        player.jump();
    }

    if(e.code==="KeyJ"){
        player.attack();
        hitEnemies(10,55);
    }

    if(e.code==="KeyQ"){
        player.combo();
    }

    if(e.code==="KeyW"){
        player.fire();
    }

    if(e.code==="ShiftLeft"){
        player.dash();
    }

});

window.addEventListener("keyup",e=>{

    keys[e.code]=false;

});

let coins=0;
let level=1;
let exp=0;
let needExp=20;

const enemies=[];
const fireballs=[];
const particles=[];

class Player{

    constructor(){

        this.x=100;
        this.y=300;

        this.w=48;
        this.h=54;

        this.vx=0;
        this.vy=0;

        this.speed=5;
        this.gravity=0.8;
        this.jumpPower=14;

        this.jumpCount=0;
        this.maxJump=2;

        this.dir=1;

        this.hp=100;
        this.maxHp=100;

        this.comboCooldown=0;
        this.fireCooldown=0;
        this.dashCooldown=0;

    }

    update(){

        if(keys.left){

            this.vx=-this.speed;
            this.dir=-1;

        }else if(keys.right){

            this.vx=this.speed;
            this.dir=1;

        }else{

            this.vx*=0.8;

        }

        this.vy+=this.gravity;

        this.x+=this.vx;
        this.y+=this.vy;

        if(this.y>groundY-this.h){

            this.y=groundY-this.h;
            this.vy=0;
            this.jumpCount=0;

        }

        if(this.comboCooldown>0)this.comboCooldown--;
        if(this.fireCooldown>0)this.fireCooldown--;
        if(this.dashCooldown>0)this.dashCooldown--;

    }

    jump(){

        if(this.jumpCount<this.maxJump){

            this.vy=-this.jumpPower;
            this.jumpCount++;

        }

    }    attack(){

        if(this.attackCooldown>0)return;

        this.attackCooldown=12;

        hitEnemies(10,55);

    }

    combo(){

        if(this.comboCooldown>0)return;

        this.comboCooldown=25;

        const damage=[12,18,30];

        for(let i=0;i<3;i++){

            setTimeout(()=>{

                hitEnemies(damage[i],70);

            },i*120);

        }

    }

    fire(){

        if(this.fireCooldown>0)return;

        this.fireCooldown=180;

        fireballs.push({

            x:this.x+this.dir*20,
            y:this.y+20,

            vx:this.dir*10,
            vy:0,

            damage:40,

            size:12

        });

    }

    dash(){

        if(this.dashCooldown>0)return;

        this.dashCooldown=60;

        this.vx=this.dir*18;

    }

}

const player=new Player();

class Slime{

    constructor(x){

        this.x=x;

        this.y=groundY-36;

        this.w=36;
        this.h=36;

        this.maxHp=30;
        this.hp=30;

        this.speed=1.5;

        this.damage=8;

        this.dead=false;

    }

    update(){

        if(this.dead)return;

        let dx=player.x-this.x;

        if(Math.abs(dx)<250){

            this.x+=Math.sign(dx)*this.speed;

        }

    }

}

enemies.push(new Slime(500));
enemies.push(new Slime(700));
enemies.push(new Slime(900));

function hitEnemies(damage,range){

    enemies.forEach(enemy=>{

        if(enemy.dead)return;

        if(

            Math.abs(player.x-enemy.x)<range &&
            Math.abs(player.y-enemy.y)<45

        ){

            enemy.hp-=damage;

            if(enemy.hp<=0){

                enemy.dead=true;

                coins++;

                gainExp(5);

            }

        }

    });

}

function gainExp(amount){

    exp+=amount;

    if(exp>=needExp){

        exp-=needExp;

        level++;

        needExp+=20;

        player.maxHp+=20;

        player.hp=player.maxHp;

    }

}class Bat{

    constructor(x,y){

        this.x=x;
        this.baseY=y;
        this.y=y;

        this.w=34;
        this.h=26;

        this.maxHp=20;
        this.hp=20;

        this.speed=2;

        this.damage=6;

        this.dead=false;

        this.frame=Math.random()*100;

    }

    update(){

        if(this.dead)return;

        this.frame++;

        this.y=this.baseY+Math.sin(this.frame*0.1)*15;

        let dx=player.x-this.x;

        if(Math.abs(dx)<320){

            this.x+=Math.sign(dx)*this.speed;

        }

    }

}

class Skeleton{

    constructor(x){

        this.x=x;
        this.y=groundY-48;

        this.w=32;
        this.h=48;

        this.maxHp=45;
        this.hp=45;

        this.dead=false;

        this.cooldown=90;

    }

    update(){

        if(this.dead)return;

        this.cooldown--;

        if(this.cooldown<=0){

            this.cooldown=90;

            bones.push({

                x:this.x,
                y:this.y+18,

                vx:player.x>this.x?6:-6,

                damage:10

            });

        }

    }

}

const bones=[];

enemies.push(new Bat(900,180));
enemies.push(new Bat(1200,220));
enemies.push(new Skeleton(1500));

function updateFireballs(){

    for(let i=fireballs.length-1;i>=0;i--){

        let f=fireballs[i];

        f.x+=f.vx;

        enemies.forEach(enemy=>{

            if(enemy.dead)return;

            if(

                Math.abs(f.x-enemy.x)<30 &&
                Math.abs(f.y-enemy.y)<30

            ){

                enemy.hp-=f.damage;

                for(let j=0;j<12;j++){

                    particles.push({

                        x:enemy.x,
                        y:enemy.y,

                        vx:(Math.random()-0.5)*6,
                        vy:-Math.random()*4,

                        life:30

                    });

                }

                fireballs.splice(i,1);

            }

        });

    }

}

function updateBones(){

    for(let i=bones.length-1;i>=0;i--){

        let b=bones[i];

        b.x+=b.vx;

        if(

            Math.abs(b.x-player.x)<24 &&
            Math.abs(b.y-player.y)<36

        ){

            player.hp-=b.damage;

            bones.splice(i,1);

        }

    }

}

function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=0.2;

        p.life--;

        if(p.life<=0){

            particles.splice(i,1);

        }

    }

}function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // 하늘
    ctx.fillStyle="#87CEEB";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 땅
    ctx.fillStyle="#3CB043";
    ctx.fillRect(0,groundY,canvas.width,canvas.height-groundY);

    // 플레이어(돼지)
    ctx.fillStyle="#FFB6C1";
    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    // 눈
    ctx.fillStyle="black";

    if(player.dir==1){

        ctx.fillRect(player.x+34,player.y+15,4,4);

    }else{

        ctx.fillRect(player.x+10,player.y+15,4,4);

    }

    // 코
    ctx.fillStyle="#FF7FA0";

    ctx.fillRect(
        player.x+18,
        player.y+22,
        12,
        8
    );

    // 몬스터
    enemies.forEach(enemy=>{

        if(enemy.dead)return;

        if(enemy instanceof Slime){

            ctx.fillStyle="limegreen";

        }else if(enemy instanceof Bat){

            ctx.fillStyle="purple";

        }else{

            ctx.fillStyle="#dddddd";

        }

        ctx.fillRect(
            enemy.x,
            enemy.y,
            enemy.w,
            enemy.h
        );

        // HP바
        ctx.fillStyle="red";
        ctx.fillRect(
            enemy.x,
            enemy.y-10,
            enemy.w,
            4
        );

        ctx.fillStyle="lime";

        ctx.fillRect(
            enemy.x,
            enemy.y-10,
            enemy.w*(enemy.hp/enemy.maxHp),
            4
        );

    });

    // 화염탄
    ctx.fillStyle="orange";

    fireballs.forEach(f=>{

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    // 파티클
    ctx.fillStyle="yellow";

    particles.forEach(p=>{

        ctx.fillRect(
            p.x,
            p.y,
            3,
            3
        );

    });

    // 플레이어 HP
    ctx.fillStyle="red";
    ctx.fillRect(20,20,200,20);

    ctx.fillStyle="lime";
    ctx.fillRect(
        20,
        20,
        200*(player.hp/player.maxHp),
        20
    );

    ctx.fillStyle="black";
    ctx.font="20px sans-serif";

    ctx.fillText(
        "HP "+player.hp+"/"+player.maxHp,
        20,
        60
    );

    ctx.fillText(
        "Lv."+level,
        20,
        90
    );

    ctx.fillText(
        "EXP "+exp+"/"+needExp,
        20,
        120
    );

    ctx.fillText(
        "🪙 "+coins,
        20,
        150
    );

}
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // 하늘
    ctx.fillStyle="#87CEEB";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 땅
    ctx.fillStyle="#3CB043";
    ctx.fillRect(0,groundY,canvas.width,canvas.height-groundY);

    // 플레이어(돼지)
    ctx.fillStyle="#FFB6C1";
    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    // 눈
    ctx.fillStyle="black";

    if(player.dir==1){

        ctx.fillRect(player.x+34,player.y+15,4,4);

    }else{

        ctx.fillRect(player.x+10,player.y+15,4,4);

    }

    // 코
    ctx.fillStyle="#FF7FA0";

    ctx.fillRect(
        player.x+18,
        player.y+22,
        12,
        8
    );

    // 몬스터
    enemies.forEach(enemy=>{

        if(enemy.dead)return;

        if(enemy instanceof Slime){

            ctx.fillStyle="limegreen";

        }else if(enemy instanceof Bat){

            ctx.fillStyle="purple";

        }else{

            ctx.fillStyle="#dddddd";

        }

        ctx.fillRect(
            enemy.x,
            enemy.y,
            enemy.w,
            enemy.h
        );

        // HP바
        ctx.fillStyle="red";
        ctx.fillRect(
            enemy.x,
            enemy.y-10,
            enemy.w,
            4
        );

        ctx.fillStyle="lime";

        ctx.fillRect(
            enemy.x,
            enemy.y-10,
            enemy.w*(enemy.hp/enemy.maxHp),

        );

    });

    ctx.fillStyle="orange";

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    // 파티클
    ctx.fillStyle="yellow";

    particles.forEach(p=>{

        ctx.fillRect(
            p.x,
            p.y,

            3
        );

    });

    // 플레이어 HP
    ctx.fillStyle="red";
    ctx.fillRect(20,20,200,20);

    ctx.fillStyle="lime";
    ctx.fillRect(
        20,
        20,
        200*(player.hp/player.maxHp),
        20
    );

    ctx.fillStyle="black";
    ctx.font="20px sans-serif";

    ctx.fillText(
        "HP "+player.hp+"/"+player.maxHp,
        20,
        60
    );

    ctx.fillText(
        "Lv."+level,
        20,
        90
    );

    ctx.fillText(
        "EXP "+exp+"/"+needExp,
        20,
        120
    );

    ctx.fillText(
        "🪙 "+coins,
        20,
        150
    );

}//==========================
// 카메라
//==========================

let cameraX=0;

function updateCamera(){

    cameraX=player.x-canvas.width/2;

    if(cameraX<0){

        cameraX=0;

    }

}

const mapWidth=5000;

//==========================
// 플랫폼
//==========================

const platforms=[

{x:0,y:groundY,w:5000,h:200},

{x:300,y:groundY-100,w:180,h:20},

{x:650,y:groundY-170,w:160,h:20},

{x:980,y:groundY-120,w:150,h:20},

{x:1300,y:groundY-230,w:220,h:20},

{x:1700,y:groundY-150,w:200,h:20},

{x:2100,y:groundY-260,w:180,h:20},

{x:2500,y:groundY-180,w:260,h:20},

{x:3000,y:groundY-120,w:240,h:20},

{x:3600,y:groundY-210,w:260,h:20}

];

function collision(){

    player.onGround=false;

    for(const p of platforms){

        if(

            player.x+player.w>p.x&&
            player.x<p.x+p.w&&
            player.y+player.h>=p.y&&
            player.y+player.h-player.vy<=p.y

        ){

            player.y=p.y-player.h;

            player.vy=0;

            player.jumpCount=0;

            player.onGround=true;

        }

    }

}

//==========================
// 배경
//==========================

function drawBackground(){

    ctx.fillStyle="#7fd6ff";

    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let i=0;i<80;i++){

        ctx.fillStyle="white";

        ctx.beginPath();

        ctx.arc(

            (i*350-cameraX*0.3)%6000,

            80+(i%4)*35,

            25,

            0,

            Math.PI*2

        );

        ctx.fill();

    }

    for(let i=0;i<60;i++){

        let x=i*180-cameraX*0.5;

        ctx.fillStyle="#5ca95c";

        ctx.fillRect(

            x,

            groundY-70,

            18,

            70

        );

        ctx.beginPath();

        ctx.arc(

            x+9,

            groundY-90,

            30,

            0,

            Math.PI*2

        );

        ctx.fill();

    }

}

//==========================
// 플랫폼 그리기
//==========================

function drawPlatforms(){

    ctx.fillStyle="#8B5A2B";

    platforms.forEach(p=>{

        ctx.fillRect(

            p.x-cameraX,

            p.y,

            p.w,

            p.h

        );

    });

}

//==========================
// 플레이어 그리기
//==========================

function drawPlayer(){

    ctx.save();

    ctx.translate(player.x-cameraX+player.w/2,player.y);

    if(player.dir==-1){

        ctx.scale(-1,1);

    }

    ctx.fillStyle="#ffb6c1";

    ctx.fillRect(

        -player.w/2,

        0,

        player.w,

        player.h

    );

    ctx.fillStyle="#ff8fb1";

    ctx.fillRect(-20,8,12,12);

    ctx.fillRect(8,8,12,12);

    ctx.fillStyle="black";

    ctx.fillRect(10,18,4,4);

    ctx.fillStyle="#ff6b8f";

    ctx.fillRect(-6,22,12,8);

    ctx.restore();

}

//==========================
// 적 그리기
//==========================

function drawEnemies(){

    enemies.forEach(enemy=>{

        if(enemy.dead)return;

        let x=enemy.x-cameraX;

        if(enemy instanceof Slime){

            ctx.fillStyle="#44dd44";

        }else if(enemy instanceof Bat){

            ctx.fillStyle="#7b3cff";

        }else{

            ctx.fillStyle="#d0d0d0";

        }

        ctx.fillRect(

            x,

            enemy.y,

            enemy.w,

            enemy.h

        );

        ctx.fillStyle="red";

        ctx.fillRect(

            x,

            enemy.y-8,

            enemy.w,

            4

        );

        ctx.fillStyle="lime";

        ctx.fillRect(

            x,

            enemy.y-8,

            enemy.w*(enemy.hp/enemy.maxHp),

            4

        );

    });

}

//==========================
// 화염탄
//==========================

function drawFireballs(){

    fireballs.forEach(f=>{

        ctx.beginPath();

        ctx.fillStyle="orange";

        ctx.arc(

            f.x-cameraX,

            f.y,

            f.size,

            0,

            Math.PI*2

        );

        ctx.fill();

        ctx.beginPath();

        ctx.fillStyle="yellow";

        ctx.arc(

            f.x-cameraX,

            f.y,

            f.size/2,

            0,

            Math.PI*2

        );

        ctx.fill();

    });

}//==========================
// 파티클 그리기
//==========================

function drawParticles(){

    particles.forEach(p=>{

        ctx.globalAlpha=p.life/30;

        ctx.fillStyle="yellow";

        ctx.fillRect(

            p.x-cameraX,

            p.y,

            3,

            3

        );

    });

    ctx.globalAlpha=1;

}

//==========================
// 아이템 그리기
//==========================

function drawItems(){

    items.forEach(item=>{

        let x=item.x-cameraX;

        if(item.type==="coin"){

            ctx.beginPath();

            ctx.fillStyle="gold";

            ctx.arc(

                x,

                item.y,

                8,

                0,

                Math.PI*2

            );

            ctx.fill();

        }

        if(item.type==="heart"){

            ctx.fillStyle="red";

            ctx.fillRect(x-5,item.y,10,10);

            ctx.fillRect(x,item.y-5,10,10);

        }

    });

}

//==========================
// 해골 뼈
//==========================

function drawBones(){

    ctx.fillStyle="white";

    bones.forEach(b=>{

        ctx.fillRect(

            b.x-cameraX,

            b.y,

            14,

            4

        );

    });

}

//==========================
// HUD
//==========================

function drawHUD(){

    ctx.fillStyle="rgba(0,0,0,.45)";

    ctx.fillRect(15,15,280,145);

    ctx.fillStyle="red";

    ctx.fillRect(30,35,220,20);

    ctx.fillStyle="lime";

    ctx.fillRect(

        30,

        35,

        220*(player.hp/player.maxHp),

        20

    );

    ctx.fillStyle="white";

    ctx.font="18px sans-serif";

    ctx.fillText(

        "HP "+player.hp+" / "+player.maxHp,

        35,

        50

    );

    ctx.fillText(

        "LEVEL : "+level,

        30,

        80

    );

    ctx.fillText(

        "EXP : "+exp+" / "+needExp,

        30,

        105

    );

    ctx.fillText(

        "COIN : "+coins,

        30,

        130

    );

}

//==========================
// 전체 Draw
//==========================

function draw(){

    drawBackground();

    drawPlatforms();

    drawItems();

    drawEnemies();

    drawPlayer();

    drawFireballs();

    drawBones();

    drawParticles();

    drawHUD();

}

//==========================
// 전체 Update
//==========================

function update(){

    player.update();

    collision();

    updateCamera();

    enemies.forEach(e=>e.update());

    updateFireballs();

    updateBones();

    updateItems();

    updateParticles();

    for(const enemy of enemies){

        if(enemy.dead)continue;

        if(enemy.hp<=0){

            enemyDeath(enemy);

        }

    }

}

//==========================
// 게임 루프
//==========================

let fps=0;
let lastTime=performance.now();

function gameLoop(now){

    fps=1000/(now-lastTime);

    lastTime=now;

    update();

    draw();

    requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

//==========================
// Stage 1
//==========================

const stage={

    name:"초원의 시작",

    width:5000,

    clearX:4700,

    completed:false

};

function checkStageClear(){

    if(player.x>=stage.clearX){

        stage.completed=true;

    }

}//==========================
// 인벤토리
//==========================

const inventory={

    coins:0,

    gems:0,

    potions:0,

    weapons:[],

    armors:[],

    materials:[]

};

function addItem(type,count=1){

    switch(type){

        case "coin":

            inventory.coins+=count;
            break;

        case "gem":

            inventory.gems+=count;
            break;

        case "potion":

            inventory.potions+=count;
            break;

        default:

            inventory.materials.push(type);

    }

}

function usePotion(){

    if(inventory.potions<=0)return;

    inventory.potions--;

    player.hp=Math.min(

        player.maxHp,

        player.hp+50

    );

}

//==========================
// 장비
//==========================

const equipment={

    weapon:null,

    armor:null,

    helmet:null,

    boots:null

};

function equipWeapon(name,atk){

    equipment.weapon={

        name,

        atk

    };

}

function getAttack(){

    let atk=10;

    if(equipment.weapon){

        atk+=equipment.weapon.atk;

    }

    return atk;

}

//==========================
// 스킬
//==========================

const skills={

    dash:1,

    fire:1,

    combo:1,

    critical:0,

    hpBoost:0

};

let skillPoint=0;

function levelUp(){

    level++;

    skillPoint++;

    needExp+=20;

    player.maxHp+=20;

    player.hp=player.maxHp;

}

function upgradeSkill(name){

    if(skillPoint<=0)return;

    skills[name]++;

    skillPoint--;

}

//==========================
// 상점
//==========================

const shop=[

function saveGame(){

    localStorage.setItem(

        "pig-save",

        JSON.stringify({

            level,

            exp,

            needExp,

            coins,

            hp:player.hp,

            maxHp:player.maxHp,

            inventory,

            equipment,

            skills

        })

    );

}

function loadGame(){

    const data=localStorage.getItem("pig-save");

    if(!data)return;

    const save=JSON.parse(data);

    level=save.level;

    exp=save.exp;

    needExp=save.needExp;

    coins=save.coins;

    player.hp=save.hp;

    player.maxHp=save.maxHp;

    Object.assign(inventory,save.inventory);

    Object.assign(equipment,save.equipment);

    Object.assign(skills,save.skills);

}

setInterval(saveGame,5000);

window.addEventListener("load",loadGame);

class ForestBoss{

    constructor(){

        this.x=4700;

        this.y=groundY-120;

        this.w=120;

        this.h=120;

        this.maxHp=500;

        this.hp=500;

        this.phase=1;

        this.cooldown=120;

        this.dead=false;

    }

    update(){

        if(this.dead)return;

        if(this.hp<300){

            this.phase=2;

        }

        if(this.hp<120){

            this.phase=3;

        }

        this.cooldown--;

        if(this.cooldown<=0){

            this.cooldown=Math.max(

                25,

                120-this.phase*25

            );

            bossAttack(this);

        }

    }

}

const boss=new ForestBoss();

function bossAttack(b){

    for(let i=0;i<8+b.phase*2;i++){

        bones.push({

            x:b.x+b.w/2,

            y:b.y+40,

            vx:(Math.random()-0.5)*8,

            damage:10+b.phase*5

        });

    }

//==========================
// 보스 AI
//==========================

function updateBoss(){

    if(boss.dead)return;

    boss.update();

    let dx=player.x-boss.x;

    if(Math.abs(dx)<450){

        boss.x+=Math.sign(dx)*1.5*boss.phase;

    }

    if(

        Math.abs(player.x-boss.x)<90&&
        Math.abs(player.y-boss.y)<100

    ){

        player.hp-=0.4*boss.phase;

    }

    if(boss.hp<=0){

        boss.dead=true;

        coins+=500;

        skillPoint+=5;

        stage.completed=true;

    }

}

class Dragon{

    constructor(){

        this.x=7600;

        this.y=groundY-220;

        this.w=220;

        this.h=180;

        this.maxHp=2500;

        this.hp=this.maxHp;

        this.phase=1;

        this.cooldown=120;

        this.dead=false;

        this.fly=0;

    }

    update(){

        if(this.dead)return;

        this.fly+=0.04;

        this.y=(groundY-220)+Math.sin(this.fly)*30;

        if(this.hp<this.maxHp*0.7)this.phase=2;

        if(this.hp<this.maxHp*0.3)this.phase=3;

        this.cooldown--;

        if(this.cooldown<=0){

            this.cooldown=Math.max(20,120-this.phase*20);

            dragonFire(this);

        }

    }

}

const dragon=new Dragon();

const dragonFireballs=[];

//==========================
// 드래곤 브레스
//==========================

function dragonFire(d){

    for(let i=0;i<6+d.phase*2;i++){

        dragonFireballs.push({

            x:d.x,

            y:d.y+70,

            vx:-7-Math.random()*3,

            vy:(Math.random()-0.5)*2,

            damage:25+d.phase*10,

            size:18

        });

    }

}

//==========================
// 드래곤 불 업데이트
//==========================

function updateDragonFire(){

    for(let i=dragonFireballs.length-1;i>=0;i--){

        const f=dragonFireballs[i];

        f.x+=f.vx;

        f.y+=f.vy;

        if(

            Math.abs(f.x-player.x)<28&&
            Math.abs(f.y-player.y)<40

        ){

            player.hp-=f.damage;

            dragonFireballs.splice(i,1);

            continue;

        }

        if(f.x<cameraX-200){

            dragonFireballs.splice(i,1);

        }

    }

}

//==========================
// 드래곤 그리기
//==========================

function drawDragon(){

    if(dragon.dead)return;

    ctx.fillStyle="#cc2222";

    ctx.fillRect(

        dragon.x-cameraX,

        dragon.y,

        dragon.w,

        dragon.h

    );

    ctx.fillStyle="#ffff66";

    ctx.fillRect(

        dragon.x-cameraX+170,

        dragon.y+50,

        12,

        12

    );

}

//==========================
// 드래곤 브레스 그리기
//==========================

function drawDragonFire(){

    dragonFireballs.forEach(f=>{

        ctx.beginPath();

        ctx.fillStyle="#ff5500";

        ctx.arc(

            f.x-cameraX,

            f.y,

            f.size,

            0,

            Math.PI*2

        );

        ctx.fill();

        ctx.beginPath();

        ctx.fillStyle="yellow";

        ctx.arc(

            f.x-cameraX,

            f.y,

            f.size/2,

            0,

            Math.PI*2

        );

        ctx.fill();

    });

}

const treasureRoom={

    x:23000,

    y:groundY-200,

    opened:false

};

function updateTreasure(){

    if(treasureRoom.opened)return;

    if(

        Math.abs(player.x-treasureRoom.x)<60

    ){

        treasureRoom.opened=true;

        coins+=5000;

        inventory.gems+=50;

        skillPoint+=10;

        addMaterial("diamond",30);

    }

}

function drawTreasure(){

    ctx.fillStyle=

    treasureRoom.opened?

    "#777":

    "#ffd700";

    ctx.fillRect(

        treasureRoom.x-cameraX,

        treasureRoom.y,

        70,

        70

    );

}

//==========================
// 최종 마왕
//==========================

class DemonKing{

    constructor(){

        this.x=26000;

        this.y=groundY-180;

        this.w=180;

        this.h=180;

        this.maxHp=10000;

        this.hp=10000;

        this.phase=1;

        this.dead=false;

        this.cooldown=90;

    }

    update(){

        if(this.dead)return;

        if(this.hp<7000)this.phase=2;
        if(this.hp<4000)this.phase=3;
        if(this.hp<1500)this.phase=4;

        this.cooldown--;

        if(this.cooldown<=0){

            this.cooldown=Math.max(15,90-this.phase*10);

            for(let i=0;i<this.phase*8;i++){

                enemyMagic.push({

                    x:this.x,

                    y:this.y+80,

                    vx:(Math.random()-0.5)*12,

                    damage:20*this.phase

                });

            }

        }

    }

}

const demonKing=new DemonKing();

function drawDemonKing(){

    if(demonKing.dead)return;

    ctx.fillStyle="#440000";

    ctx.fillRect(

        demonKing.x-cameraX,

        demonKing.y,

        demonKing.w,

        demonKing.h

    );

    ctx.fillStyle="#ff0000";

    ctx.fillRect(

        demonKing.x-cameraX+40,

        demonKing.y+40,

        20,

        20

    );

    ctx.fillRect(

        demonKing.x-cameraX+120,

        demonKing.y+40,

        20,

        20

    );

}

// 승리
//==========================

function checkVictory(){

    if(demonKing.hp<=0&&!demonKing.dead){

        demonKing.dead=true;

        game.victory=true;

        coins+=100000;

        skillPoint+=100;

    }

}

function drawVictory(){

    if(!game.victory)return;

    ctx.fillStyle="rgba(0,0,0,.8)";

    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );

    ctx.fillStyle="gold";

    ctx.font="64px sans-serif";

    ctx.textAlign="center";

    ctx.fillText(

        "🎉 GAME CLEAR 🎉",

        canvas.width/2,

        canvas.height/2

    );

    ctx.font="30px sans-serif";

    ctx.fillText(

        "최종 마왕을 쓰러뜨렸습니다!",

        canvas.width/2,

        canvas.height/2+70

    );

    ctx.textAlign="left";

}
