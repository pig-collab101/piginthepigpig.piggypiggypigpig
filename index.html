<canvas id="c"></canvas>
<script>
const c=document.getElementById("c");
const x=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

const keys={};
addEventListener("keydown",e=>keys[e.code]=1);
addEventListener("keyup",e=>keys[e.code]=0);

let bullets=[];

const p={
  x:200,y:200,vx:0,vy:0,dir:1
};

addEventListener("mousedown",()=>{
  bullets.push({
    x:p.x+20*p.dir,
    y:p.y-10,
    vx:10*p.dir
  });
});

function drawStick(px,py,dir){

  // 머리
  x.beginPath();
  x.arc(px,py,18,0,Math.PI*2);
  x.stroke();

  // 몸
  x.beginPath();
  x.moveTo(px,py+18);
  x.lineTo(px,py+70);
  x.stroke();

  // 팔 (총 들고 있음)
  x.beginPath();
  x.moveTo(px,py+40);
  x.lineTo(px+25*dir,py+45);
  x.lineTo(px+40*dir,py+35);
  x.stroke();

  // 다리
  x.beginPath();
  x.moveTo(px,py+70);
  x.lineTo(px-15,py+110);
  x.moveTo(px,py+70);
  x.lineTo(px+15,py+110);
  x.stroke();

  // 눈
  x.fillRect(px-6,py-3,3,3);
  x.fillRect(px+3,py-3,3,3);
}

function update(){

  if(keys.ArrowLeft){p.x-=5;p.dir=-1;}
  if(keys.ArrowRight){p.x+=5;p.dir=1;}
  if(keys.ArrowUp)p.y-=5;
  if(keys.ArrowDown)p.y+=5;

  // 총알 이동
  for(let i=bullets.length-1;i>=0;i--){
    bullets[i].x+=bullets[i].vx;
    if(bullets[i].x<-100||bullets[i].x>innerWidth+100){
      bullets.splice(i,1);
    }
  }
}

function draw(){

  x.clearRect(0,0,c.width,c.height);

  // 스틱맨
  x.strokeStyle="black";
  drawStick(p.x,p.y,p.dir);

  // 총알
  x.fillStyle="orange";
  for(let b of bullets){
    x.fillRect(b.x,b.y,8,3);
  }

  // 크로스헤어
  x.beginPath();
  x.arc(p.x+60*p.dir,p.y-10,5,0,Math.PI*2);
  x.stroke();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
