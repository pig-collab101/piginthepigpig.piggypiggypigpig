<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chunk Engine v2</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

//////////////////////////////
// 🌍 SEED WORLD
//////////////////////////////
const SEED = 12345;

function rand(x){
return Math.sin(x*SEED)*10000 - Math.floor(Math.sin(x*SEED)*10000);
}

function noise(x){
return Math.sin(x*0.1)+Math.sin(x*0.03)*2;
}

//////////////////////////////
// 🧱 WORLD BLOCKS
//////////////////////////////
const TILE=32;
const CHUNK_SIZE=24;

const chunks=new Map();

function getBiome(x){
if(x<200) return "plains";
if(x<500) return "forest";
return "cave";
}

function getBlockColor(type){
if(type==="grass") return "#3cb043";
if(type==="dirt") return "#8B5A2B";
if(type==="stone") return "#777";
if(type==="sand") return "#d9c27a";
return "#000";
}

function generateChunk(cx){

if(chunks.has(cx)) return chunks.get(cx);

const blocks=[];

for(let i=0;i<CHUNK_SIZE;i++){

const wx=cx*CHUNK_SIZE+i;

const biome=getBiome(wx);

let h = Math.floor(10 + noise(wx)*3);

let top="grass";
let mid="dirt";
let deep="stone";

if(biome==="desert") top="sand";
if(biome==="cave") top="stone";

for(let y=0;y<h;y++){

let type="stone";

if(y===h-1) type=top;
else if(y>h-4) type=mid;

blocks.push({
x:wx*TILE,
y:(20-y)*TILE,
type
});

}

}

chunks.set(cx,blocks);
return blocks;
}

//////////////////////////////
// 👤 PLAYER
//////////////////////////////
const player={
x:100,y:100,
vx:0,vy:0,
w:20,h:28,
onGround:false
};

const key={};
addEventListener("keydown",e=>key[e.code]=true);
addEventListener("keyup",e=>key[e.code]=false);

//////////////////////////////
// ⚔ COMBAT SYSTEM (분리됨)
//////////////////////////////
function attack(){
for(const m of mobs){
if(Math.abs(m.x-player.x)<40){
m.hp-=10;
}
}
}

//////////////////////////////
// 👾 AI SYSTEM
//////////////////////////////
const mobs=[];

function spawnMob(x){
mobs.push({
x,
y:100,
hp:20,
type:Math.random()>0.5?"chase":"wander"
});
}

spawnMob(300);
spawnMob(600);

function updateMobs(){
for(const m of mobs){

if(m.type==="chase"){
m.x += Math.sign(player.x-m.x)*0.5;
}else{
m.x += Math.sin(Date.now()/1000)*0.3;
}

}
}

//////////////////////////////
// 🌫 CAMERA + FOG
//////////////////////////////
let cameraX=0;

function updateCamera(){
cameraX=player.x-innerWidth/2;
}

function drawFog(){
ctx.fillStyle="rgba(255,255,255,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);
}

//////////////////////////////
// 🎮 UPDATE PLAYER
//////////////////////////////
function updatePlayer(){

player.vx=0;

if(key["ArrowLeft"]) player.vx=-2;
if(key["ArrowRight"]) player.vx=2;

if(key["Space"] && player.onGround){
player.vy=-6;
player.onGround=false;
}

player.vy+=0.3;

player.x+=player.vx;
player.y+=player.vy;

// collision
player.onGround=false;

const cx=Math.floor(player.x/(TILE*CHUNK_SIZE));
const chunk=generateChunk(cx);

for(const b of chunk){
if(
player.x < b.x+TILE &&
player.x+player.w > b.x &&
player.y < b.y+TILE &&
player.y+player.h > b.y
){
player.y=b.y-player.h;
player.vy=0;
player.onGround=true;
}
}
}

//////////////////////////////
// 🎨 DRAW WORLD
//////////////////////////////
function drawWorld(){

for(let i=-2;i<3;i++){

const cx=Math.floor((player.x+i*innerWidth)/(TILE*CHUNK_SIZE));
const chunk=generateChunk(cx);

for(const b of chunk){

ctx.fillStyle=getBlockColor(b.type);

ctx.fillRect(
b.x-cameraX,
b.y,
TILE,
TILE
);

}
}

}

//////////////////////////////
// 👾 DRAW MOBS
//////////////////////////////
function drawMobs(){
ctx.fillStyle="red";
for(const m of mobs){
ctx.fillRect(m.x-cameraX,m.y,20,20);
}
}

//////////////////////////////
// 🎮 LOOP
//////////////////////////////
function loop(){

updatePlayer();
updateMobs();
updateCamera();

ctx.clearRect(0,0,canvas.width,canvas.height);

// sky
ctx.fillStyle="#87CEEB";
ctx.fillRect(0,0,canvas.width,canvas.height);

drawWorld();
drawMobs();
drawFog();

// player
ctx.fillStyle="pink";
ctx.fillRect(player.x-cameraX,player.y,player.w,player.h);

requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
