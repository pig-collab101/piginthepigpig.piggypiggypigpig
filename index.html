<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pig RPG Engine v3</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
// =====================
// 🎮 CORE ENGINE
// =====================
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

const GAME={
  state:"world",
  keys:{},
  cameraX:0
};

// =====================
// ⚡ EVENT SYSTEM
// =====================
const EVENT={
  list:{},

  on(n,f){
    if(!this.list[n]) this.list[n]=[];
    this.list[n].push(f);
  },

  emit(n,d){
    (this.list[n]||[]).forEach(f=>f(d));
  }
};

// =====================
// 🐷 PLAYER
// =====================
const player={
  x:100,y:200,w:40,h:40,
  hp:100,maxHp:100,
  combo:0
};

// =====================
// 🧬 ENTITIES
// =====================
const ENTITIES=[];

// =====================
// 👾 MONSTER SYSTEM
// =====================
function Monster(data){
  Object.assign(this,data);
  this.dead=false;

  this.update=()=>{
    if(this.dead) return;

    let dx=player.x-this.x;
    this.x+=Math.sign(dx)*(this.speed||1);
  };
}

// =====================
// 🔥 GENERATOR
// =====================
function spawn(count){
  ENTITIES.length=0;

  for(let i=0;i<count;i++){
    ENTITIES.push(new Monster({
      name:"M"+i,
      x:300+i*60,
      y:200,
      hp:20+i*2,
      speed:0.5+(i%3)*0.3
    }));
  }
}

// =====================
// ⚔️ COMBAT
// =====================
function attack(){
  if(GAME.state!=="battle") return;

  player.combo++;

  ENTITIES.forEach(e=>{
    if(!e.dead && Math.abs(e.x-player.x)<60){
      e.hp-=10+player.combo;
      if(e.hp<=0){
        e.dead=true;
        EVENT.emit("kill",e);
      }
    }
  });
}

// =====================
// 🧪 CRAFT
// =====================
const materials={iron:5,wood:5};

const recipes={
  iron_sword:{iron:3,wood:1}
};

function craft(name){
  const r=recipes[name];
  if(!r) return;

  for(let k in r){
    if(materials[k]<r[k]) return;
  }

  for(let k in r){
    materials[k]-=r[k];
  }

  console.log("crafted",name);
}

// =====================
// 🎮 INPUT
// =====================
addEventListener("keydown",e=>{
  GAME.keys[e.code]=true;

  if(e.code==="Space") attack();

  if(e.code==="KeyB"){
    GAME.state="battle";
    spawn(10);
  }

  if(e.code==="KeyM"){
    GAME.state="world";
  }

  if(e.code==="KeyC"){
    craft("iron_sword");
  }
});

addEventListener("keyup",e=>{
  GAME.keys[e.code]=false;
});

// =====================
// 🔄 UPDATE
// =====================
function update(){

  if(GAME.keys["ArrowRight"]) player.x+=4;
  if(GAME.keys["ArrowLeft"]) player.x-=4;

  GAME.cameraX=player.x-innerWidth/2;

  if(GAME.state==="battle"){
    ENTITIES.forEach(e=>e.update());
  }
}

// =====================
// 🎨 DRAW
// =====================
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // ground
  ctx.fillStyle="#3CB043";
  ctx.fillRect(0,300,canvas.width,200);

  // player
  ctx.fillStyle="pink";
  ctx.fillRect(player.x-GAME.cameraX,player.y,40,40);

  // monsters
  ENTITIES.forEach(e=>{
    if(e.dead) return;
    ctx.fillStyle="green";
    ctx.fillRect(e.x-GAME.cameraX,e.y,30,30);
  });

  ctx.fillStyle="#000";
  ctx.fillText("STATE:"+GAME.state,20,20);
}

// =====================
// 🔁 LOOP
// =====================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

spawn(5);
loop();

</script>
</body>
</html>
