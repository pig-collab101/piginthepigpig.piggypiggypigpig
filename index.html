<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pig Engine v1</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#87CEEB;
}
canvas{
  display:block;
}
</style>
</head>

<body>

<script>
// =========================
// CANVAS SETUP
// =========================
const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");
document.body.appendChild(canvas);

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
window.addEventListener("resize",resize);
resize();

// =========================
// GAME STATE
// =========================
const game={paused:false};

// =========================
// INPUT
// =========================
const keys={};

window.addEventListener("keydown",e=>{
  keys[e.code]=true;
});

window.addEventListener("keyup",e=>{
  keys[e.code]=false;
});

// =========================
// PLAYER
// =========================
const player={
  x:100,
  y:300,
  vx:0,
  vy:0,
  w:40,
  h:50,
  hp:100,
  speed:5,
  gravity:0.8,
  onGround:false,
  dir:1,
  weapon:"wood"
};

function updatePlayer(){
  if(keys["ArrowLeft"]) player.vx=-player.speed, player.dir=-1;
  else if(keys["ArrowRight"]) player.vx=player.speed, player.dir=1;
  else player.vx*=0.8;

  if(keys["Space"] && player.onGround){
    player.vy=-12;
    player.onGround=false;
  }

  player.vy+=player.gravity;
  player.x+=player.vx;
  player.y+=player.vy;

  if(player.y>400){
    player.y=400;
    player.vy=0;
    player.onGround=true;
  }
}

// =========================
// MONSTERS (DATA DRIVEN)
// =========================
const MONSTERS=[
  {id:"slime",hp:30,speed:1,atk:5,color:"green"},
  {id:"bat",hp:20,speed:2,atk:4,color:"purple"},
  {id:"wizard",hp:80,speed:0.5,atk:10,color:"cyan"},
  {id:"orc",hp:120,speed:1.2,atk:15,color:"brown"},
  {id:"ghost",hp:40,speed:2.5,atk:8,color:"white"}
];

// =========================
// WEAPONS
// =========================
const WEAPONS={
  wood:{atk:5},
  iron:{atk:12},
  diamond:{atk:30}
};

// =========================
// STORY
// =========================
const STORY=[
  "돼지 전사가 깨어났다",
  "몬스터 등장",
  "숲이 위험",
  "보스 출현"
];

// =========================
// ENTITY FACTORY
// =========================
function createMonster(type,x,y){
  const base=MONSTERS.find(m=>m.id===type);

  return{
    ...base,
    x,y,
    hp:base.hp,
    dead:false,

    update(){
      if(this.dead) return;

      const dx=player.x-this.x;
      this.x+=Math.sign(dx)*this.speed;

      if(Math.abs(dx)<40){
        player.hp-=this.atk*0.01;
      }

      if(this.hp<=0) this.dead=true;
    },

    draw(){
      ctx.fillStyle=this.color;
      ctx.fillRect(this.x,this.y,40,40);
    }
  };
}

// =========================
// WORLD
// =========================
const enemies=[];

function spawnWave(level){
  const pool=MONSTERS.map(m=>m.id);

  for(let i=0;i<level*2;i++){
    const type=pool[Math.random()*pool.length|0];
    enemies.push(createMonster(type,500+i*80,400));
  }
}

// =========================
// ATTACK
// =========================
function attack(){
  const atk=WEAPONS[player.weapon].atk;

  enemies.forEach(e=>{
    if(e.dead) return;
    if(Math.abs(e.x-player.x)<50){
      e.hp-=atk;
    }
  });
}

// =========================
// UPDATE
// =========================
function update(){
  if(game.paused) return;

  updatePlayer();
  enemies.forEach(e=>e.update());
}

// =========================
// DRAW
// =========================
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // player
  ctx.fillStyle="pink";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  // enemies
  enemies.forEach(e=>e.draw());

  // UI
  ctx.fillStyle="black";
  ctx.fillText("HP:"+player.hp,20,20);
}

// =========================
// LOOP
// =========================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// =========================
// INIT
// =========================
spawnWave(3);
console.log(STORY[0]);
loop();

</script>
</body>
</html>
