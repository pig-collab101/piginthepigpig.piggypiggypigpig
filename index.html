<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Pig RPG Engine</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;}
canvas{display:block;}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

// ======================
// 🧠 GAME STATE ENGINE
// ======================
const GAME={
  state:"world", // world / battle
  keys:{},
  cameraX:0
};

// ======================
// 🐷 PLAYER
// ======================
const player={
  x:100,y:200,w:40,h:40,
  vx:0,vy:0,
  hp:100,maxHp:100,
  dir:1
};

// ======================
// 👾 DATA
// ======================
let monsters=[];
let projectiles=[];
let materials={iron:5,wood:5};

// ======================
// 🧬 MONSTER TEMPLATE (40종 확장용)
// ======================
const MONSTER_BASE=[
 {name:"슬라임",hp:30,atk:3,color:"green"},
 {name:"박쥐",hp:20,atk:5,color:"purple"},
 {name:"해골",hp:50,atk:8,color:"gray"}
];

// ======================
// 🔥 MONSTER GENERATOR (40개 자동)
// ======================
function spawnMonsters(count){
  monsters=[];
  for(let i=0;i<count;i++){
    const base=MONSTER_BASE[i%MONSTER_BASE.length];

    monsters.push({
      ...base,
      x:300+i*60,
      y:200,
      hp:base.hp+Math.random()*10,
      dead:false
    });
  }
}

// ======================
// ⚔️ COMBAT ENGINE
// ======================
function attack(){
  if(GAME.state!=="battle") return;

  monsters.forEach(m=>{
    if(!m.dead && Math.abs(m.x-player.x)<60){
      m.hp-=20;
      if(m.hp<=0) m.dead=true;
    }
  });
}

// ======================
// 🧪 CRAFT SYSTEM
// ======================
const recipes={
  iron_sword:{iron:3,wood:1}
};

function craft(name){
  const r=recipes[name];
  if(!r) return;

  for(let k in r){
    if(materials[k]<r[k]) return;
  }

  for(let k in r){
    materials[k]-=r[k];
  }

  console.log("crafted:",name);
}

// ======================
// 🎮 INPUT
// ======================
addEventListener("keydown",e=>{
  GAME.keys[e.code]=true;

  if(e.code==="Space") attack();

  if(e.code==="KeyB"){
    GAME.state="battle";
    spawnMonsters(10); // 40 가능
  }

  if(e.code==="KeyM"){
    GAME.state="world";
  }

  if(e.code==="KeyC"){
    craft("iron_sword");
  }
});

addEventListener("keyup",e=>{
  GAME.keys[e.code]=false;
});

// ======================
// 🔄 UPDATE ENGINE
// ======================
function update(){
  if(GAME.keys["ArrowRight"]) player.x+=4;
  if(GAME.keys["ArrowLeft"]) player.x-=4;

  GAME.cameraX=player.x-innerWidth/2;

  if(GAME.state==="battle"){
    monsters.forEach(m=>{
      if(!m.dead){
        let dx=player.x-m.x;
        m.x+=Math.sign(dx)*0.5;
      }
    });
  }
}

// ======================
// 🎨 DRAW ENGINE
// ======================
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // ground
  ctx.fillStyle="#3CB043";
  ctx.fillRect(0,300,canvas.width,200);

  // player
  ctx.fillStyle="pink";
  ctx.fillRect(player.x-GAME.cameraX,player.y,40,40);

  // monsters
  monsters.forEach(m=>{
    if(m.dead) return;

    ctx.fillStyle=m.color;
    ctx.fillRect(m.x-GAME.cameraX,m.y,30,30);
  });

  // UI
  ctx.fillStyle="#000";
  ctx.fillText("STATE:"+GAME.state,20,20);
}

// ======================
// 🎮 LOOP
// ======================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

spawnMonsters(5);
loop();

</script>
</body>
</html>
