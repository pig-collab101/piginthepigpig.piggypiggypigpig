<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Block War Engine</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;}
canvas{display:block;}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const x=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

// ======================
// 기본 값
// ======================
const keys={};
addEventListener("keydown",e=>keys[e.code]=1);
addEventListener("keyup",e=>keys[e.code]=0);

const blockSize=40;
const blocks=[];
const bullets=[];

// ======================
// 플레이어
// ======================
const player={
  x:200,y:200,w:30,h:50,
  vx:0,vy:0,
  dir:1,
  onGround:false
};

// ======================
// 적
// ======================
const enemies=[
  {x:600,y:100,w:30,h:40,hp:50,dead:false}
];

// ======================
// 블록 설치/삭제
// ======================
addEventListener("keydown",e=>{

  // 블록 설치
  if(e.code==="KeyZ"){
    blocks.push({
      x:Math.floor(player.x/blockSize)*blockSize,
      y:Math.floor(player.y/blockSize)*blockSize+40
    });
  }

  // 블록 삭제
  if(e.code==="KeyX"){
    for(let i=blocks.length-1;i>=0;i--){
      let b=blocks[i];
      if(Math.abs(b.x-player.x)<50 && Math.abs(b.y-player.y)<80){
        blocks.splice(i,1);
        break;
      }
    }
  }

  // 총 발사
  if(e.code==="KeyF"){
    bullets.push({
      x:player.x,
      y:player.y,
      vx:8*player.dir
    });
  }

});

// ======================
// 충돌 (블록)
// ======================
function collide(ent){
  ent.onGround=false;

  for(const b of blocks){
    if(
      ent.x+ent.w>b.x &&
      ent.x<b.x+blockSize &&
      ent.y+ent.h>b.y &&
      ent.y+ent.h-ent.vy<=b.y
    ){
      ent.y=b.y-ent.h;
      ent.vy=0;
      ent.onGround=true;
    }
  }
}

// ======================
// 업데이트
// ======================
function update(){

  // 이동
  if(keys.ArrowLeft){player.x-=4;player.dir=-1;}
  if(keys.ArrowRight){player.x+=4;player.dir=1;}

  // 점프
  if(keys.Space && player.onGround){
    player.vy=-10;
  }

  // 중력
  player.vy+=0.5;
  player.y+=player.vy;

  collide(player);

  // 적 이동
  enemies.forEach(e=>{
    if(e.dead)return;
    if(Math.abs(player.x-e.x)<200){
      e.x+=Math.sign(player.x-e.x)*1.2;
    }
  });

  // 총알
  for(let i=bullets.length-1;i>=0;i--){
    let b=bullets[i];
    b.x+=b.vx;

    // 적 충돌
    for(const e of enemies){
      if(!e.dead &&
        Math.abs(b.x-e.x)<20 &&
        Math.abs(b.y-e.y)<30){
        e.hp-=20;
        bullets.splice(i,1);
        if(e.hp<=0)e.dead=true;
        break;
      }
    }
  }

}

// ======================
// 그리기
// ======================
function draw(){

  x.clearRect(0,0,c.width,c.height);

  // 하늘
  x.fillStyle="#87CEEB";
  x.fillRect(0,0,c.width,c.height);

  // 블록
  x.fillStyle="#8B5A2B";
  for(const b of blocks){
    x.fillRect(b.x,b.y,blockSize,blockSize);
  }

  // 플레이어
  x.fillStyle="pink";
  x.fillRect(player.x,player.y,player.w,player.h);

  // 적
  x.fillStyle="green";
  enemies.forEach(e=>{
    if(!e.dead){
      x.fillRect(e.x,e.y,e.w,e.h);
    }
  });

  // 총알
  x.fillStyle="orange";
  bullets.forEach(b=>{
    x.fillRect(b.x,b.y,6,3);
  });

}

// ======================
// 루프
// ======================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
