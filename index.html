<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pig Engine Reset v1</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
// =====================
// CORE ENGINE
// =====================
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
window.onresize=resize;
resize();

// =====================
// INPUT (BUG FIXED)
// =====================
const key={};

window.addEventListener("keydown",e=>{
  key[e.code]=true;
});

window.addEventListener("keyup",e=>{
  key[e.code]=false;
});

// =====================
// WORLD
// =====================
const world={
  width:8000,
  groundY:400
};

let cameraX=0;

// =====================
// PLAYER (LOCKED CONTROL)
// =====================
const player={
  x:100,y:200,
  w:40,h:50,
  vx:0,vy:0,
  speed:5,
  jumpPower:12,
  onGround:false,
  hp:100
};

function updatePlayer(){
  // move
  if(key["ArrowLeft"]) player.vx=-player.speed;
  else if(key["ArrowRight"]) player.vx=player.speed;
  else player.vx*=0.8;

  // jump
  if(key["Space"] && player.onGround){
    player.vy=-player.jumpPower;
    player.onGround=false;
  }

  player.vy+=0.6;

  player.x+=player.vx;
  player.y+=player.vy;

  // ground
  if(player.y+player.h>world.groundY){
    player.y=world.groundY-player.h;
    player.vy=0;
    player.onGround=true;
  }
}

// =====================
// CAMERA (FIXED)
// =====================
function updateCamera(){
  cameraX = player.x - canvas.width/2;
  if(cameraX<0) cameraX=0;
}

// =====================
// MONSTER AUTO GENERATOR (40 TYPES)
// =====================
const monsters=[];

function createMonsterType(i){
  return {
    id:i,
    hp:20+i*2,
    speed:1+(i%5)*0.2,
    damage:5+(i%3),
    color:`hsl(${i*9},70%,60%)`
  };
}

const monsterTypes=[];
for(let i=0;i<40;i++){
  monsterTypes.push(createMonsterType(i));
}

function spawnMonsters(){
  for(let i=0;i<30;i++){
    const t=monsterTypes[i%40];
    monsters.push({
      x:400+i*250,
      y:world.groundY-40,
      w:35,h:35,
      vx:0,
      hp:t.hp,
      type:t
    });
  }
}
spawnMonsters();

// =====================
// COMBAT SYSTEM (SEPARATED)
// =====================
function attack(){
  monsters.forEach(m=>{
    if(Math.abs(player.x-m.x)<60){
      m.hp-=20;
    }
  });
}

window.addEventListener("keydown",e=>{
  if(e.code==="KeyJ") attack();
});

// =====================
// MONSTER AI (NOT PLAYER CONTROLLED)
// =====================
function updateMonsters(){
  monsters.forEach(m=>{
    if(m.hp<=0) return;

    const dx=player.x-m.x;

    if(Math.abs(dx)<300){
      m.x += Math.sign(dx)*m.type.speed;
    }
  });
}

// =====================
// COLLISION SIMPLE FIX
// =====================
function collision(){
  monsters.forEach(m=>{
    if(m.hp<=0) return;

    if(
      Math.abs(player.x-m.x)<30 &&
      Math.abs(player.y-m.y)<40
    ){
      player.hp-=0.5;
    }
  });
}

// =====================
// DRAW
// =====================
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // background
  ctx.fillStyle="#87CEEB";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ground
  ctx.fillStyle="#3cb043";
  ctx.fillRect(0,world.groundY-cameraX,world.width,200);

  // player
  ctx.fillStyle="pink";
  ctx.fillRect(player.x-cameraX,player.y,player.w,player.h);

  // monsters
  monsters.forEach(m=>{
    if(m.hp<=0) return;

    ctx.fillStyle=m.type.color;
    ctx.fillRect(m.x-cameraX,m.y,m.w,m.h);
  });

  // UI
  ctx.fillStyle="black";
  ctx.fillText("HP:"+player.hp,20,20);
}

// =====================
// LOOP
// =====================
function loop(){
  updatePlayer();
  updateCamera();
  updateMonsters();
  collision();

  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
